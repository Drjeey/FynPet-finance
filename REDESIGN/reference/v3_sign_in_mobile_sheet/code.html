ainer":"#1d2025"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-sm":"0.5rem",gutter:"1.25rem",margin:"2rem","space-xs":"0.25rem","space-md":"0.75rem","space-lg":"1.25rem","space-xl":"1.5rem"},fontFamily:{"display-currency":["Manrope"],"metric-large":["Manrope"],"headline-sm":["Manrope"],"body-lg":["Inter"],"headline-lg":["Manrope"],"headline-md":["Manrope"],"body-sm":["Inter"],"label-sm":["Inter"],"metric-regular":["Manrope"],"body-md":["Inter"],"label-md":["Inter"]},fontSize:{"display-currency":["40px",{lineHeight:"48px",letterSpacing:"-0.03em",fontWeight:"800"}],"metric-large":["28px",{lineHeight:"36px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-sm":["20px",{lineHeight:"28px",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",letterSpacing:"-0.01em",fontWeight:"700"}],"body-sm":["12px",{lineHeight:"16px",fontWeight:"400"}],"label-sm":["11px",{lineHeight:"14px",letterSpacing:"0.04em",fontWeight:"600"}],"metric-regular":["18px",{lineHeight:"24px",letterSpacing:"-0.01em",fontWeight:"700"}],"body-md":["14px",{lineHeight:"20px",fontWeight:"400"}],"label-md":["13px",{lineHeight:"16px",fontWeight:"500"}]}}}};</script><style>

  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen relative overflow-hidden antialiased"><header class="fixed top-0 w-full z-20 pt-safe bg-surface/40 backdrop-blur-md opacity-45 pointer-events-none select-none"><div class="h-16 px-gutter flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm"><img alt="FynPet app icon logo mark: electric lime #C6F432 rounded square with ~22% corner radius on transparent canvas, featuring centered bold geometric 'FP' monogram in #0A0D12 with interlocking tight kerning." class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrDuZcLEvV7ZFoE2DtYoh51ZIVERTt1GweXOfukxolPQYsfG2lmdduXwDRgktry7C-4mecraWjhaTotJRJ_nG32gmWf9yCzr8q6BcOOkzVfo0nugS6xS77DiqNBJTqRtb-rPqHnRptq_piw6MUQfjDcCAwec70sBuiW_irP36eY0kWmW-zQ-tthqhUmogsG_fNl6yiMIrAOyNYWmZN1MwracS7ZspSQ-QzOUT6cQIxrH"/><span class="font-headline-sm text-headline-sm text-primary-container font-bold tracking-tight">FynPet</span></div><h1 class="text-center font-headline-sm text-headline-sm text-on-surface font-semibold truncate flex-1 px-space-xs">Settings</h1><div class="flex items-center gap-space-sm"><span class="material-symbols-outlined text-[20px] text-on-surface-variant">sync</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><div class="fixed inset-0 z-30 bg-black/65 backdrop-blur-[2px] transition-opacity duration-300"></div><div class="fixed top-2.5 left-1/2 -translate-x-1/2 z-40 pointer-events-none"><span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-highest/80 text-on-surface-variant font-label-sm text-label-sm backdrop-blur-md shadow-sm"><span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>Sample data - design preview</span></div><section class="fixed bottom-0 inset-x-0 z-40 max-h-[777px] flex flex-col rounded-t-[28px] bg-surface-container-low shadow-[0_-8px_32px_rgba(0,0,0,0.65)] overflow-hidden transition-transform duration-300 ease-out"><div class="pt-3 pb-1 flex flex-col items-center flex-shrink-0 cursor-grab active:cursor-grabbing"><div class="w-10 h-1.5 rounded-full bg-white/20 hover:bg-white/30 transition-colors"></div></div><div class="h-14 px-gutter flex items-center justify-between gap-space-sm flex-shrink-0"><h2 class="font-headline-sm text-headline-sm font-semibold text-on-surface tracking-tight truncate">Account Security</h2><button aria-label="Close sheet" class="w-11 h-11 min-h-[44px] min-w-[44px] rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">close</span></button></div><main class="flex-1 overflow-y-auto px-gutter py-space-sm overscroll-contain bg-surface-container-low pb-safe"><div class="flex flex-col w-full pb-6 space-y-5">
<!-- Segmented Control Pill Toggle -->
<div aria-label="Authentication type" class="w-full bg-surface-container p-1 rounded-full flex items-center justify-between" role="tablist">
<button aria-selected="true" class="flex-1 h-11 rounded-full bg-primary-container text-on-primary-fixed font-body-md text-body-md font-bold flex items-center justify-center transition-all duration-200" id="tab-signin" onclick="setAuthMode('signin')" role="tab" type="button">
      Sign in
    </button>
<button aria-selected="false" class="flex-1 h-11 rounded-full text-on-surface-variant font-body-md text-body-md font-medium flex items-center justify-center transition-all duration-200 hover:text-on-surface" id="tab-signup" onclick="setAuthMode('signup')" role="tab" type="button">
      Create account
    </button>
</div>
<!-- Header Typography Cluster -->
<div class="flex flex-col space-y-1">
<div class="flex items-center gap-2">
<h3 class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight" id="sheet-title">Sign in to sync</h3>
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-surface-container-high text-primary-fixed-dim">
<span class="material-symbols-outlined text-[14px]">cloud_sync</span>
</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant" id="sheet-subtitle">Open your records on any device.</p>
</div>
<!-- Authentication Form -->
<form class="flex flex-col space-y-4 pt-1" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="auth-email">Email</label>
<div class="relative w-full flex items-center">
<input autocomplete="email" class="w-full h-12 px-4 rounded-xl bg-surface-dim text-primary font-body-lg text-body-lg focus:outline-none focus:ring-0 focus:bg-surface-container-high transition-colors" id="auth-email" placeholder="name@example.com" required="" type="email" value="wanjiru@example.com"/>
<div class="absolute right-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="auth-password">Password</label>
<button class="font-body-sm text-body-sm text-primary-fixed-dim hover:underline min-h-[24px] flex items-center" type="button">
          Forgot password?
        </button>
</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-16 rounded-xl bg-surface-dim text-primary font-body-lg text-body-lg focus:outline-none focus:ring-0 focus:bg-surface-container-high transition-colors" id="auth-password" placeholder="••••••••••••" required="" type="password" value="SuperSecret2025!"/>
<button aria-label="Toggle password visibility" class="absolute right-1 top-1 bottom-1 px-3 min-w-[44px] min-h-[44px] flex items-center justify-center font-body-md text-body-md font-semibold text-primary-fixed-dim hover:text-primary transition-colors" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
          Show
        </button>
</div>
</div>
<!-- Primary Actions Stack -->
<div class="flex flex-col space-y-2 pt-2">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary-fixed font-body-md text-body-md font-bold flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-transform" id="submit-action-btn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full min-h-[44px] py-2.5 rounded-full text-on-surface-variant hover:text-primary font-body-md text-body-md text-center transition-colors flex items-center justify-center" onclick="history.back()" type="button">
        Continue without signing in
      </button>
</div>
</form>
<!-- Reassurance Trust Banner -->
<div class="flex items-center justify-center gap-2 pt-1 px-2 text-center">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant shrink-0" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Your records stay on this device until you sign in.</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('auth-password');
    const toggleBtn = document.getElementById('toggle-password-btn');
    if (!pwdInput || !toggleBtn) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      toggleBtn.textContent = 'Hide';
    } else {
      pwdInput.type = 'password';
      toggleBtn.textContent = 'Show';
    }
  }

  function setAuthMode(mode) {
    const signinTab = document.getElementById('tab-signin');
    const signupTab = document.getElementById('tab-signup');
    const title = document.getElementById('sheet-title');
    const subtitle = document.getElementById('sheet-subtitle');
    const submitBtn = document.getElementById('submit-action-btn');

    if (mode === 'signup') {
      signinTab.className = "flex-1 h-11 rounded-full text-on-surface-variant font-body-md text-body-md font-medium flex items-center justify-center transition-all duration-200 hover:text-on-surface";
      signinTab.setAttribute('aria-selected', 'false');
      signupTab.className = "flex-1 h-11 rounded-full bg-primary-container text-on-primary-fixed font-body-md text-body-md font-bold flex items-center justify-center transition-all duration-200";
      signupTab.setAttribute('aria-selected', 'true');
      
      title.textContent = "Create an account";
      subtitle.textContent = "Back up and sync securely across all phones.";
      submitBtn.innerHTML = '<span>Create account</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
    } else {
      signupTab.className = "flex-1 h-11 rounded-full text-on-surface-variant font-body-md text-body-md font-medium flex items-center justify-center transition-all duration-200 hover:text-on-surface";
      signupTab.setAttribute('aria-selected', 'false');
      signinTab.className = "flex-1 h-11 rounded-full bg-primary-container text-on-primary-fixed font-body-md text-body-md font-bold flex items-center justify-center transition-all duration-200";
      signinTab.setAttribute('aria-selected', 'true');

      title.textContent = "Sign in to sync";
      subtitle.textContent = "Open your records on any device.";
      submitBtn.innerHTML = '<span>Sign in</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
    }
  }
</script><div class="w-full flex justify-center py-2 flex-shrink-0"><div class="w-32 h-1 rounded-full bg-white/25"></div></div></main></section></body></html>
